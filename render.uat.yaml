services:
  - type: web
    name: tracking-system-backend-uat
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      # Same production database as tracking-system-backend (tracking-system-db) —
      # set these to match that service's DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD
      # values (visible on the tracking-system-db database's "Connect" page) when
      # creating this Blueprint in the Render dashboard.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,https://tracking-system-frontend-uat.onrender.com
      - key: TZ
        value: Asia/Kolkata
