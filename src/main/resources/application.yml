spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/tracking_system
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
