name: Keep backend alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          echo "Pinging at $(date -u)"
          curl -fsS --max-time 30 --retry 3 --retry-delay 5 -w "\nHTTP %{http_code} in %{time_total}s\n" https://tracking-system-backend-htdd.onrender.com/api/health
